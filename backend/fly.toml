app = "ticketar"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  NODE_ENV = "production"
  DB_PATH = "/data/ticketar.db"
  PORT = "8080"

[[mounts]]
  source = "ticketar_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
